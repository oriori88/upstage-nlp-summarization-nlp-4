general:
  data_path: ../../../../data/processed_prefix
  model_name: paust/pko-t5-base
  output_dir: ./
inference:
  batch_size: 16
  ckt_path: ./checkpoint/
  early_stopping: true
  generate_max_length: 100
  min_length: 20
  no_repeat_ngram_size: 2
  num_beams: 5
  remove_tokens:
  - </s>
  - <pad>
  result_path: ./prediction/
tokenizer:
  decoder_max_len: 128
  encoder_max_len: 512
  eos_token: </s>
  special_tokens:
  - '#Person1#'
  - '#Person2#'
  - '#Person3#'
  - '#Person4#'
  - '#Person5#'
  - '#Person6#'
  - '#Person7#'
  - '#PhoneNumber#'
  - '#Address#'
  - '#PassportNumber#'
training:
  dataloader_num_workers: 0
  dataloader_pin_memory: false
  do_eval: true
  do_train: true
  early_stopping_patience: null
  early_stopping_threshold: 0.001
  evaluation_strategy: epoch
  fp16: true
  generation_max_length: 100
  gradient_accumulation_steps: 2
  gradient_checkpointing: true
  label_smoothing: 0.1
  learning_rate: 3.0e-05
  load_best_model_at_end: false
  logging_dir: ./logs
  logging_steps: 10
  logging_strategy: epoch
  lr_scheduler_type: polynomial
  max_grad_norm: 1.0
  num_train_epochs: 5
  optim: adamw_torch
  overwrite_output_dir: true
  per_device_eval_batch_size: 16
  per_device_train_batch_size: 16
  predict_with_generate: true
  report_to: wandb
  save_strategy: epoch
  save_total_limit: 5
  seed: 42
  warmup_ratio: 0.05
  weight_decay: 0.01
wandb:
  entity: imeanseo_
  name: paust/pko-t5-base_V2
  project: dialogue_summarize_paust
