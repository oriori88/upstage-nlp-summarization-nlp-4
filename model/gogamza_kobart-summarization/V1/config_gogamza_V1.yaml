general:
  data_path: ../../../../data/processed
  model_name: gogamza/kobart-summarization
  output_dir: ./
inference:
  batch_size: 16
  ckt_path: ./checkpoint/
  early_stopping: true
  generate_max_length: 80
  min_length: 20
  no_repeat_ngram_size: 3
  num_beams: 5
  remove_tokens:
  - <usr>
  - <unk>
  - <s>
  - </s>
  - <pad>
  result_path: ./prediction/
tokenizer:
  bos_token: <s>
  decoder_max_len: 128
  encoder_max_len: 512
  eos_token: </s>
  special_tokens:
  - '#Person1#'
  - '#Person2#'
  - '#Person3#'
  - '#Person4#'
  - '#Person5#'
  - '#Person6#'
  - '#Person7#'
  - '#PhoneNumber#'
  - '#Address#'
  - '#PassportNumber#'
training:
  do_eval: true
  do_train: true
  early_stopping_patience: 2
  early_stopping_threshold: 0.001
  evaluation_strategy: epoch
  fp16: true
  generation_max_length: 80
  gradient_accumulation_steps: 2
  learning_rate: 1.5e-05
  load_best_model_at_end: true
  logging_dir: ./logs
  logging_strategy: epoch
  lr_scheduler_type: cosine
  num_train_epochs: 10
  optim: adamw_torch
  overwrite_output_dir: true
  per_device_eval_batch_size: 16
  per_device_train_batch_size: 16
  predict_with_generate: true
  report_to: wandb
  save_strategy: epoch
  save_total_limit: 3
  seed: 42
  warmup_ratio: 0.15
  weight_decay: 0.01
wandb:
  entity: imeanseo_
  name: gogamza/kobart-summarization_V1
  project: dialogue-summarization
